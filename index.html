<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePay Dashboard</title>
    <style>
        body { 
            margin: 0; 
            font-family: Arial, sans-serif; 
            display: flex; 
            background: #0f172a; 
            color: white; 
        }
        .sidebar { 
            width: 250px; 
            background: #0b1120; 
            padding-top: 20px; 
            height: 100vh; 
            position: fixed; 
        }
        .sidebar div { 
            padding: 15px 25px; 
            cursor: pointer; 
            color: #cbd5e1; 
        }
        .sidebar div:hover, .sidebar .active { 
            background: #3b82f6; 
            color: white; 
            border-radius: 8px; 
            margin: 0 10px; 
        }
        .main { 
            margin-left: 250px; 
            padding: 30px; 
            flex-grow: 1; 
            background: #0f172a; 
            min-height: 100vh; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
        }
        .card { 
            background: #1e293b; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }
        .card h3 { 
            margin-top: 0; 
            color: #f8fafc; 
        }
        input, select { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 10px; 
            border-radius: 5px; 
            border: 1px solid #475569; 
            background: #334155; 
            color: white; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 10px; 
            background: #3b82f6; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button:hover { background: #2563eb; }
        .result { margin-top: 10px; font-size: 0.9em; color: #10b981; }
        .error { color: #ef4444; }
        ul { list-style: none; padding: 0; margin-top: 10px; font-size: 0.9em; }
        li { padding: 8px 0; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>

    <!-- Sidebar Structure -->
    <div class="sidebar">
        <div>⊞ Overview</div>
        <div>💸 Transfer Funds</div>
        <div>👥 Beneficiaries</div>
        <div>💳 Cards & Limits</div>
        <div class="active">💰 Loans & Deposits</div>
        <div>📄 Statements</div>
        <div>⚙️ Security Settings</div>
        <div>📞 Priority Support</div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <h2>SecurePay Dashboard</h2>
        <div class="grid">
            
            <!-- EXISTING FEATURE MOCKUP -->
            <div class="card">
                <h3>💸 Quick Transfer</h3>
                <input type="text" placeholder="Recipient Account Number">
                <input type="number" placeholder="Amount (₹)">
                <button onclick="alert('Transfer backend pending integration.')">Send Money</button>
            </div>

            <!-- 1. BBPS Bill Payments -->
            <div class="card">
                <h3>📱 Pay Bills & Recharge</h3>
                <select id="bill-type">
                    <option value="mobile">Mobile Recharge</option>
                    <option value="electricity">Electricity</option>
                    <option value="water">Water</option>
                </select>
                <input type="text" id="bill-account" placeholder="Mobile Number or ID">
                <input type="number" id="bill-amount" placeholder="Amount">
                <button onclick="payBill()">Pay Now</button>
                <div id="bbps-result" class="result"></div>
            </div>

            <!-- 2. Service Requests -->
            <div class="card">
                <h3>📝 Service Requests</h3>
                <select id="request-type">
                    <option value="Chequebook">New Chequebook</option>
                    <option value="AddressUpdate">Update Address</option>
                </select>
                <input type="text" id="request-details" placeholder="Additional details...">
                <button onclick="submitRequest()">Submit Request</button>
                <div id="service-result" class="result"></div>
            </div>

            <!-- 3. Investments & Trading -->
            <div class="card">
                <h3>📈 Live Stock Tracker</h3>
                <input type="text" id="stock-symbol" placeholder="Symbol (e.g., AAPL)" value="AAPL">
                <button onclick="checkStock()">Get Live Quote</button>
                <div id="stock-result" class="result"></div>
            </div>

            <!-- 4. Grievance Tracker -->
            <div class="card">
                <h3>🛡️ Dispute Tracker</h3>
                <select id="issue-type">
                    <option value="Unexpected Charge">Unexpected Charge</option>
                    <option value="Failed Transaction">Failed Transaction</option>
                    <option value="Unauthorized Account Conversion">Unauthorized Account Conversion</option>
                    <option value="Non-maintenance Charges">Non-maintenance Charges</option>
                </select>
                <input type="text" id="issue-desc" placeholder="Describe the issue...">
                <button onclick="fileGrievance()">File Dispute</button>
                <ul id="ticket-list"></ul>
            </div>
            
        </div>
    </div>

    <!-- Frontend API Logic -->
    <script>
        // 1. BBPS Bills
        async function payBill() {
            const resultBox = document.getElementById('bbps-result');
            resultBox.innerText = "Processing payment...";
            resultBox.className = 'result';
            try {
                const res = await fetch('/api/bbps', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        type: document.getElementById('bill-type').value, 
                        accountNumber: document.getElementById('bill-account').value, 
                        amount: document.getElementById('bill-amount').value 
                    })
                });
                const data = await res.json();
                resultBox.innerText = data.message;
            } catch (e) {
                resultBox.innerText = "Failed to connect to /api/bbps";
                resultBox.className = 'result error';
            }
        }

        // 2. Service Requests
        async function submitRequest() {
            const resultBox = document.getElementById('service-result');
            resultBox.innerText = "Submitting...";
            resultBox.className = 'result';
            try {
                const res = await fetch('/api/service_request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        requestType: document.getElementById('request-type').value, 
                        details: document.getElementById('request-details').value 
                    })
                });
                const data = await res.json();
                resultBox.innerText = `Ref: ${data.referenceId} (${data.status})`;
            } catch (e) {
                resultBox.innerText = "Failed to submit to /api/service_request";
                resultBox.className = 'result error';
            }
        }

        // 3. Investments
        async function checkStock() {
            const resultBox = document.getElementById('stock-result');
            resultBox.innerText = "Loading data...";
            resultBox.className = 'result';
            try {
                const symbol = document.getElementById('stock-symbol').value.toUpperCase();
                const res = await fetch(`/api/invest?symbol=${symbol}`);
                const data = await res.json();
                if (data.success) {
                    resultBox.innerHTML = `Price: $${data.currentPrice} <br> High/Low: $${data.high} / $${data.low}`;
                } else {
                    resultBox.innerText = "Error fetching data.";
                    resultBox.className = 'result error';
                }
            } catch (e) {
                resultBox.innerText = "API connection failed. Ensure /api/invest is running.";
                resultBox.className = 'result error';
            }
        }

        // 4. Grievance Tracker
        async function fileGrievance() {
            try {
                await fetch('/api/grievance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        issueType: document.getElementById('issue-type').value, 
                        description: document.getElementById('issue-desc').value 
                    })
                });
                document.getElementById('issue-desc').value = "";
                loadTickets();
            } catch (e) {
                alert("Error filing dispute.");
            }
        }

        async function loadTickets() {
            try {
                const res = await fetch('/api/grievance');
                const data = await res.json();
                let html = data.tickets.length ? "" : "<li>No active disputes.</li>";
                data.tickets.forEach(tkt => {
                    html += `<li><strong>${tkt.id}</strong>: ${tkt.issueType} <br><span style="color:#fbbf24;">${tkt.status}</span></li>`;
                });
                document.getElementById('ticket-list').innerHTML = html;
            } catch (e) {
                document.getElementById('ticket-list').innerHTML = "<li class='error'>Waiting for /api/grievance connection...</li>";
            }
        }

        // Initialize on load
        window.onload = loadTickets;
    </script>
</body>
</html>
